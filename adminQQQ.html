<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⚙️ CatEnc Admin</title>
<!-- Подключаем библиотеку для QR-кодов -->
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root {
    --md-primary: #D0BCFF; --md-on-primary: #381E72;
    --md-primary-container: #4F378B; --md-on-primary-container: #EADDFF;
    --md-error: #F2B8B5; --md-tertiary: #EFB8C8;
    --md-background: #141218; --md-on-background: #E6E0E9;
    --md-surface-container-low: #1D1B20; --md-surface-container: #211F26;
    --md-surface-container-high: #2B2930; --md-surface-container-highest: #36343B;
    --md-on-surface-variant: #CAC4D0; --md-outline-variant: #49454F;
    --radius-md: 16px; --radius-xl: 28px; --radius-full: 999px;
    --elev-3: 0 8px 24px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Roboto', system-ui, sans-serif;
    background: var(--md-background); color: var(--md-on-background);
    min-height: 100vh; padding: 20px; display: flex; justify-content: center;
  }
  .admin-container {
    background: var(--md-surface-container-low);
    border-radius: var(--radius-xl); padding: 32px 24px;
    max-width: 760px; width: 100%; box-shadow: var(--elev-3);
  }
  .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .admin-header h2 { font-size: 24px; background: linear-gradient(90deg, var(--md-primary), var(--md-tertiary)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  label { display: block; margin: 18px 4px 8px; font-size: 13px; font-weight: 500; color: var(--md-on-surface-variant); }
  input {
    width: 100%; padding: 16px; border-radius: var(--radius-md);
    border: 1px solid var(--md-outline-variant); background: var(--md-surface-container-high);
    color: var(--md-on-background); font-size: 15px; font-family: inherit; outline: none;
  }
  input:focus { border-color: var(--md-primary); }
  .buttons { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  button {
    flex: 1; padding: 16px 20px; border: none; border-radius: var(--radius-full);
    font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
    transition: transform 0.1s;
  }
  button:active { transform: scale(0.97); }
  .btn-main { background: var(--md-primary); color: var(--md-on-primary); }
  .btn-tonal { background: var(--md-surface-container-high); color: var(--md-on-background); }
  .btn-error-tonal { background: rgba(242,184,181,0.15); color: var(--md-error); }
  .btn-mini { padding: 12px; min-height: 44px; flex: 0 0 auto; }
  .keygen { display: flex; gap: 8px; margin-top: 6px; }
  .keygen input { flex: 1; }
  .key-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; margin-bottom: 8px;
    background: var(--md-surface-container-high);
    border-radius: var(--radius-md); font-family: monospace; font-size: 14px;
    gap: 12px; flex-wrap: wrap;
  }
  .key-row .code { flex: 1; word-break: break-all; }
  .key-row .meta { font-size: 11px; color: var(--md-on-surface-variant); font-family: sans-serif; }
  .gate-msg { margin-top: 16px; font-size: 13px; color: var(--md-error); min-height: 18px; }

  /* Модалка QR-кода */
  #qrModal { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; padding: 20px; }
  #qrModal.active { display: flex; }
  .qr-box { background: var(--md-surface-container); padding: 24px; border-radius: var(--radius-xl); width: 100%; max-width: 320px; text-align: center; }
  .qr-box h3 { margin-bottom: 16px; color: var(--md-primary); font-size: 18px; }
  #qrCanvasContainer { background: #fff; padding: 16px; border-radius: var(--radius-md); display: inline-block; margin-bottom: 16px; }
  .qr-key-text { font-family: monospace; font-size: 12px; color: var(--md-on-surface-variant); margin-bottom: 16px; word-break: break-all; }
</style>
</head>
<body>

<div class="admin-container">
  <div class="admin-header">
    <h2>⚙️ Админ-панель</h2>
  </div>

  <label>Новый ключ</label>
  <div class="keygen">
    <input type="text" id="newKey" placeholder="CAT-XXXX-XXXX" style="font-family: monospace;">
    <button class="btn-tonal btn-mini" onclick="generateRandomKey()">🎲</button>
  </div>
  
  <div class="keygen" style="margin-top: 10px;">
    <div style="flex:1;">
      <label style="margin-top:0;">Лимит устройств</label>
      <input type="number" id="newDeviceLimit" value="1" min="1" max="10">
    </div>
    <div style="flex:1;">
      <label style="margin-top:0;">Дней действия</label>
      <input type="number" id="newDays" value="30" min="1">
    </div>
  </div>

  <div class="buttons" style="margin-top:12px;">
    <button class="btn-main" onclick="createKey()">➕ Создать ключ</button>
  </div>

  <label style="margin-top:24px;">Список ключей в БД</label>
  <div id="keysList" style="margin-top:8px;">
    <div style="color:var(--md-on-surface-variant); font-size:13px;">Загрузка...</div>
  </div>

  <div class="gate-msg" id="adminMsg" style="margin-top:16px;"></div>
</div>

<!-- Модалка с QR-кодом -->
<div id="qrModal">
  <div class="qr-box">
    <h3>QR-код ключа</h3>
    <div id="qrCanvasContainer"></div>
    <div class="qr-key-text" id="qrKeyText"></div>
    <button class="btn-tonal" onclick="closeQR()" style="width:100%;">Закрыть</button>
  </div>
</div>

<!-- Firebase SDK и загрузка конфига -->
<script type="module">
  async function loadFirebaseConfig() {
    try {
      const response = await fetch('CatBase.firebase');
      if (!response.ok) throw new Error('Not found');
      return await response.json();
    } catch (err) {
      document.getElementById('adminMsg').textContent = '⚠ Ошибка: Нет файла CatBase.firebase';
      return null;
    }
  }

  async function initApp() {
    const firebaseConfig = await loadFirebaseConfig();
    if (!firebaseConfig) return;

    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
    const { getFirestore, collection, doc, setDoc, deleteDoc, getDocs } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    
    window.firebaseDB = { db, collection, doc, setDoc, deleteDoc, getDocs };
    window.dispatchEvent(new Event('firebase-ready'));
  }

  initApp();
</script>

<script>
let fb = null;

window.addEventListener('firebase-ready', () => {
  fb = window.firebaseDB;
  loadKeys();
});

// ================= ГЕНЕРАЦИЯ QR-КОДА =================
function showQRCode(text) {
  const modal = document.getElementById('qrModal');
  const container = document.getElementById('qrCanvasContainer');
  const keyText = document.getElementById('qrKeyText');
  
  // Очищаем контейнер
  container.innerHTML = '';
  keyText.textContent = text;
  
  // Создаем QR-код (библиотека qrcode-generator)
  const qr = qrcode(0, 'L'); // 0 = авто-размер, L = уровень коррекции
  qr.addData(text);
  qr.make();
  
  // Вставляем как SVG (идеально масштабируется)
  container.innerHTML = qr.createSvgTag({ cellSize: 5, margin: 0 });
  modal.classList.add('active');
}

function closeQR() {
  document.getElementById('qrModal').classList.remove('active');
}

// ================= УПРАВЛЕНИЕ КЛЮЧАМИ =================
function generateRandomKey() {
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let key = 'CAT-';
  for (let i = 0; i < 4; i++) {
    for (let j = 0; j < 4; j++) key += chars.charAt(Math.floor(Math.random() * chars.length));
    if (i < 3) key += '-';
  }
  document.getElementById('newKey').value = key;
}

async function createKey() {
  const key = document.getElementById('newKey').value.trim();
  const limit = parseInt(document.getElementById('newDeviceLimit').value) || 1;
  const days = parseInt(document.getElementById('newDays').value) || 30;
  const msg = document.getElementById('adminMsg');

  if (!key) { msg.textContent = '⚠ Введите ключ'; return; }
  if (!fb) return;

  msg.textContent = 'Создание...';
  try {
    const { db, doc, setDoc } = fb;
    
    await setDoc(doc(db, 'keys', key), {
      code: key,
      createdAt: new Date(),
      deviceLimit: limit,
      durationDays: days,
      devices: [],
      used: false
    });
    
    msg.textContent = '✅ Ключ создан!';
    document.getElementById('newKey').value = '';
    loadKeys();
    
    // Сразу показываем QR-код для нового ключа
    showQRCode(key);
  } catch (e) {
    msg.textContent = '⚠ Ошибка: ' + e.message;
  }
}

async function loadKeys() {
  const list = document.getElementById('keysList');
  if (!fb) return;
  try {
    const { db, collection, getDocs } = fb;
    const querySnapshot = await getDocs(collection(db, 'keys'));
    if (querySnapshot.empty) {
      list.innerHTML = '<div style="color:var(--md-on-surface-variant);">Нет ключей</div>';
      return;
    }
    list.innerHTML = '';
    querySnapshot.forEach((doc) => {
      const data = doc.data();
      const devices = data.devices || [];
      const limit = data.deviceLimit || 1;
      
      const div = document.createElement('div');
      div.className = 'key-row';
      div.innerHTML = `
        <div class="code">${doc.id}</div>
        <div class="meta">Устройства: ${devices.length}/${limit}</div>
        <div class="key-actions" style="display:flex; gap:6px;">
          <button class="btn-tonal btn-mini" onclick="showQRCode('${doc.id}')" title="Показать QR">📷</button>
          <button class="btn-error-tonal btn-mini" onclick="deleteKey('${doc.id}')" title="Удалить">🗑</button>
        </div>
      `;
      list.appendChild(div);
    });
  } catch (e) {
    list.innerHTML = `<div style="color:var(--md-error);">Ошибка: ${e.message}</div>`;
  }
}

async function deleteKey(id) {
  if (!confirm('Удалить ключ ' + id + '?')) return;
  try {
    const { db, doc, deleteDoc } = fb;
    await deleteDoc(doc(db, 'keys', id));
    loadKeys();
  } catch (e) { alert('Ошибка: ' + e.message); }
}
</script>
</body>
</html>
